url: https://andre031222.github.io/peru-survey-indicators-r/
lang: es

# Same pattern and order as the faperu site, its own face: a light bar,
# Plus Jakarta Sans and navy. A home button, one theme button (automatic by
# default), quiet code boxes and a real footer. See pkgdown/extra.css.
template:
  bootstrap: 5
  light-switch: true
  bslib:
    bg: "#ffffff"
    fg: "#1d1d1f"
    primary: "#0f426f"
    secondary: "#0b7c8f"
    link-color: "#0f426f"
    border-radius: 0.75rem
    base_font: {google: "Plus Jakarta Sans"}
    heading_font: {google: "Plus Jakarta Sans"}
    code_font: {google: "JetBrains Mono"}
    headings-font-weight: 700

home:
  title: "faperu.analysis: indicadores oficiales del Perú con su diseño muestral"
  description: >
    Estimaciones con error estándar, intervalo y banda de calidad del INEI,
    indicadores verificados contra cifras oficiales, uniones entre encuestas,
    tablas y mapas.
  sidebar:
    structure: [links, license, citation, people]
    components:
      people:
        title: Autores
        text: >
          [Richar Andre Vilca Solorzano](https://orcid.org/0009-0003-2385-5263)<br>
          [Fred Torres Cruz](https://orcid.org/0000-0003-0834-6834)
  links:
  - text: Tablero en línea
    href: http://127.0.0.1:8098/
  - text: faperu, para obtener los datos
    href: https://andre031222.github.io/peru-official-surveys-r/

navbar:
  bg: light
  structure:
    left: [home, intro, gallery, reference, articles, news]
    right: [search, dashboard, github, theme]
  components:
    home:
      icon: fa-house
      text: Inicio
      href: index.html
    intro:
      text: Empezar
      href: articles/faperu.analysis.html
    gallery:
      text: Galería
      href: articles/galeria.html
    reference:
      text: Funciones
      href: reference/index.html
    articles:
      text: Artículos
      menu:
      - text: Instalar paso a paso
        href: articles/instalar.html
      - text: Galería de indicadores 2024
        href: articles/galeria.html
      - text: Guía completa
        href: articles/faperu.analysis.html
    news:
      text: Cambios
      href: news/index.html
    dashboard:
      icon: fa-chart-column
      text: Tablero
      href: http://127.0.0.1:8098/
    github:
      icon: fa-github
      href: https://github.com/Andre031222/peru-survey-indicators-r
      aria-label: GitHub
    theme:
      icon: fa-circle-half-stroke
      href: "#theme"
      aria-label: Cambiar tema

reference:
- title: "Estimar"
  desc: "Media, proporción o total con su precisión."
  contents:
  - fpa_estimate
  - fpa_quality
- title: "Indicadores listos"
  desc: "Siete indicadores que reproducen las cifras oficiales del INEI."
  contents:
  - fpa_indicators
  - fpa_indicator
- title: "Cruzar encuestas"
  contents:
  - fpa_link
- title: "Mapas y tablas"
  contents:
  - fpa_geometry
  - fpa_map
  - fpa_table
- title: "Impresión, resumen y gráfico"
  contents:
  - fpa-methods
- title: "Paquete"
  contents:
  - faperu.analysis-package

footer:
  structure:
    left: [about]
    right: [made]
  components:
    about: >
      **faperu.analysis** · Richar Andre Vilca Solorzano y Fred Torres Cruz · Licencia MIT<br>
      Independiente del INEI; nunca redistribuye microdatos.
    made: >
      [GitHub](https://github.com/Andre031222/peru-survey-indicators-r) ·
      [faperu](https://andre031222.github.io/peru-official-surveys-r/) ·
      Hecho con [pkgdown](https://pkgdown.r-lib.org/)
